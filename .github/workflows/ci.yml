name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (app)
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      - name: TypeScript check (CLI)
        run: npx tsc --noEmit
        working-directory: cli
